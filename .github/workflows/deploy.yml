name: Deploy

# Runs on a self-hosted runner installed on the production Mac
# (172.16.100.17). The runner makes an outbound connection to GitHub to pick
# up jobs, which works even though that machine only has a private LAN
# address GitHub's own cloud runners could never reach.
# Runner registration (once, on the production Mac):
#   cd ~/actions-runner && ./config.sh --url <repo-url> --token <github-token>
#   ./run.sh   (or ./svc.sh install && ./svc.sh start for a daemon)
# The token comes from repo Settings → Actions → Runners → New self-hosted runner.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      # The runner checks out into ~/actions-runner/_work, while the
      # application actually runs from ~/Desktop/SVO — to keep both in sync
      # without copying, deploy-local.sh does `git pull` in the real
      # directory. The checkout below is still useful so GitHub shows the
      # exact commit being deployed.
      - uses: actions/checkout@v4

      - name: Deploy (backup, pull, migrate, build, restart)
        run: |
          bash ./deploy-local.sh
